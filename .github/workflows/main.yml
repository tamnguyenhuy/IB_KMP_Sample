name: Verify

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-android:
    name: 🤖 Android Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradle executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: ./gradlew composeApp:assembleDebug --stacktrace

#      - name: Run tests
#        run: ./gradlew composeApp:allTests --stacktrace

      - name: Run Detekt (static analysis)
        run: |
          cd tooling
          chmod +x ../gradlew
          ../gradlew :detekt:detekt --stacktrace

  verify-ios:
    name: 🍎 iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradle executable
        run: chmod +x ./gradlew

      - name: Compile iOS target
        run: ./gradlew composeApp:compileKotlinIosSimulatorArm64 --stacktrace
